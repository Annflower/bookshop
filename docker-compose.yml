# docker-compose для локального запуска (или облака).
# Переменные окружения берутся из .env (см. .env.example).

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: bookshop_full
    ports:
      - "3306:3306"
    volumes:
      - ../bookshop_full/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
      - db_data:/var/lib/mysql

volumes:
  db_data: